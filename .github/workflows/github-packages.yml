name: github-packages

# Mirrors a released version to GitHub Packages' npm registry as @jordanallenlewis/ccrig, so the package shows on
# the repository and profile pages. npmjs.com stays the install source (`npm i -g ccrig`): GitHub's npm registry asks
# for a token even to install a public package, so nobody is pointed at the mirror.
#
# release.yml calls this after the tests, the mod suite and the tag check pass. To mirror a tag that was released
# before this existed: Actions tab -> github-packages -> Run workflow -> ref = the tag (for example v1.9.0).
# No stored token: the job's own GITHUB_TOKEN publishes, with packages: write. Re-running is a no-op.
on:
  workflow_call:
    inputs:
      ref:
        description: tag to mirror
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: tag to mirror, for example v1.9.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  mirror:
    name: mirror to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jordanallenlewis'
      - name: Publish @jordanallenlewis/ccrig unless this version is already there
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub's npm registry only takes scoped names, so the scope is added here and never committed.
          npm pkg set name=@jordanallenlewis/ccrig
          VER="$(node -p "require('./package.json').version")"
          if [ "$(npm view "@jordanallenlewis/ccrig@$VER" version 2>/dev/null)" = "$VER" ]; then
            echo "@jordanallenlewis/ccrig@$VER is already on GitHub Packages; nothing to publish"
            exit 0
          fi
          npm publish
          echo "published @jordanallenlewis/ccrig@$VER to GitHub Packages"
