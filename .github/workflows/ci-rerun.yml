name: ci-rerun

# One automatic retry for a main run that failed only because a hosted runner was never acquired
# (a job cancelled with zero steps, e.g. "The job was not acquired by Runner of type hosted even
# after multiple attempts"). The retry reruns those same jobs, so every test still runs; a job that
# started and failed is never retried, and a run is retried once at most (attempt 1 only).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun when every unfinished job never started
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate)
          # jobs that did not pass, and of those the ones that ran at least one step
          bad=$(jq -s '[.[].jobs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length' <<<"$jobs")
          unstarted=$(jq -s '[.[].jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0)] | length' <<<"$jobs")
          echo "not passed: $bad, never started: $unstarted"
          if [ "$bad" -gt 0 ] && [ "$bad" -eq "$unstarted" ]; then
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
            echo "reran the $unstarted job(s) that never started"
          else
            echo "a job that started did not pass, or nothing to retry: no rerun"
          fi
