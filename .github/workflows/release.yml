name: release

# Publish on a version tag: test on all three OSes, then publish to npm with provenance
# via Trusted Publishing (OIDC) — no stored npm token — and cut a GitHub Release.
#
# Release flow (maintainer):  bump version + CHANGELOG  ->  git tag vX.Y.Z  ->  git push --tags
#
# ONE-TIME SETUP on npmjs.com (required before the first tokenless publish):
#   npmjs.com -> package "ccrig" -> Settings -> Trusted Publishers -> Add GitHub Actions:
#     Organization/user: jordanallenlewis   Repository: ccrig   Workflow: release.yml
# After that, no npm token ever lives in this repo or on a laptop.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: git identity (tests make commits)
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - name: Tests + quality gates
        run: node --test
      - name: Packaged smoke test
        run: node .github/smoke.js
      - name: Self-test render
        run: node statusline.js --selftest
      - name: PowerShell switcher parse-check
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/claude-profiles.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'claude-profiles.ps1 parses clean'
      - name: Shellcheck the bash helpers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck claude-profiles.sh install.sh

  publish:
    name: publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # OIDC for npm Trusted Publishing + provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the tag-on-main check needs history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Use an npm that supports Trusted Publishing (OIDC)
        # pinned: this job holds publish rights (id-token), so never run whatever npm@latest is today
        run: npm install -g npm@11.20.0
      - name: Tag must be on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Tag must match package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }
      - name: Publish (provenance, tokenless via OIDC)
        run: npm publish --provenance --access public
      - name: Changelog section for this version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '/^## \[/{ if (p) exit } $0 ~ ("^## \\[" v "\\]") { p=1 } p' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "See CHANGELOG.md" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: GitHub Release
        # statusline.js as an asset gives the standalone install a stable latest-release URL
        run: gh release create "$GITHUB_REF_NAME" statusline.js --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
